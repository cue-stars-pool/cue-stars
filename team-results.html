<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Results - Stapleford Cue Stars Pool Team</title>
<style>
  :root{
    --felt: #0f4d3a;
    --felt-dark: #0a3a2b;
    --rail: #4a2c1d;
    --rail-dark: #331f14;
    --ivory: #f3ede0;
    --gold: #c9a227;
    --line: rgba(243,237,224,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.04), transparent 40%),
      var(--felt);
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      var(--felt);
    font-family: 'Segoe UI', -apple-system, system-ui, sans-serif;
    color: var(--ivory);
    padding-bottom: 60px;
  }
  .rail{
    background: linear-gradient(180deg, var(--rail) 0%, var(--rail-dark) 100%);
    border-bottom: 4.5px solid var(--gold);
    padding: 24px 15px 20px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  }
  .rail-inner{ max-width: 640px; margin: 0 auto; }
  .back-link{
    color: var(--gold);
    font-size: 12px;
    text-decoration: none;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  h1{
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: clamp(19px, 4vw, 30px);
    margin: 4px 0 0;
    color: var(--ivory);
    text-shadow: 0 2px 0 rgba(0,0,0,0.3);
  }

  main{
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 15px 0;
  }

  .status-line{
    font-size: 11px;
    color: rgba(243,237,224,0.6);
    margin-bottom: 14px;
    letter-spacing: 0.3px;
  }

  .filter-field{ margin-bottom: 18px; max-width: 220px; }
  .filter-field label{
    display:block;
    color: var(--gold);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 5px;
  }
  .filter-field select{
    width: 100%;
    background: var(--ivory);
    color: #1c1b19;
    border: 1px solid var(--line);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
  }
  .filter-field select:focus{ outline:none; border-color: var(--gold); }

  .recent-form{ margin-bottom: 20px; }
  .recent-form-title{
    color: var(--gold);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .recent-form-strip{ display: flex; gap: 8px; }
  .recent-form-dot{
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
    cursor: default;
  }
  .recent-form-dot.win{ background: rgba(143,209,158,0.2); color: #8fd19e; border: 1px solid rgba(143,209,158,0.4); }
  .recent-form-dot.loss{ background: rgba(217,83,79,0.2); color: #ff8a80; border: 1px solid rgba(217,83,79,0.4); }
  .recent-form-dot.draw{ background: rgba(243,237,224,0.12); color: rgba(243,237,224,0.7); border: 1px solid rgba(243,237,224,0.3); }
  .recent-form-empty{
    font-size: 12px;
    color: rgba(243,237,224,0.45);
  }

  .match-list{ display: flex; flex-direction: column; gap: 10px; }
  .match-card{
    background: rgba(0,0,0,0.18);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .match-row{
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    cursor: pointer;
  }
  .match-row .chevron{
    display: inline-block;
    margin-left: 6px;
    font-size: 10px;
    color: rgba(243,237,224,0.4);
    transition: transform 0.15s ease;
  }
  .match-card.expanded .match-row .chevron{ transform: rotate(180deg); }
  .match-date{
    font-size: 11px;
    color: rgba(243,237,224,0.55);
    margin-bottom: 4px;
  }
  .match-fixture{
    font-size: 14px;
    font-weight: 600;
    color: var(--ivory);
  }
  .match-fixture .vs{
    font-weight: 400;
    color: rgba(243,237,224,0.5);
    font-size: 12px;
    margin: 0 4px;
  }
  .match-score-wrap{ text-align: right; flex-shrink: 0; }
  .match-score{
    font-family: 'Oswald', sans-serif;
    font-size: 22px;
    font-weight: 700;
  }
  .match-tag{
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 700;
    margin-top: 2px;
  }
  .match-score.win, .match-tag.win{ color: #8fd19e; }
  .match-score.loss, .match-tag.loss{ color: #ff8a80; }
  .match-score.draw, .match-tag.draw{ color: rgba(243,237,224,0.7); }

  .legs-panel{
    display: none;
    border-top: 1px solid var(--line);
    padding: 6px 16px 10px;
  }
  .match-card.expanded .legs-panel{ display: block; }
  .leg-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .leg-row:last-child{ border-bottom: none; }
  .leg-row .leg-num{
    font-size: 11px;
    font-weight: 700;
    color: rgba(243,237,224,0.5);
    width: 44px;
    flex-shrink: 0;
  }
  .leg-row .leg-player{
    flex: 1;
    font-weight: 600;
    color: var(--ivory);
  }
  .leg-row .leg-badge{
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .leg-badge.win{ background: rgba(143,209,158,0.18); color: #8fd19e; }
  .leg-badge.lose{ background: rgba(217,83,79,0.18); color: #ff8a80; }

  .empty-state{
    text-align: center;
    padding: 40px 24px;
    color: rgba(243,237,224,0.6);
  }
  .empty-state .tri{ font-size: 30px; margin-bottom: 8px; }
  .empty-state p{ margin: 4px 0; font-size: 13px; }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="rail">
  <div class="rail-inner">
    <a class="back-link" href="index.html">&larr; Home</a>
    <h1>Match Results 📋</h1>
  </div>
</div>

<main>
  <div class="filter-field">
    <label for="seasonFilter">Season</label>
    <select id="seasonFilter">
      <option value="all">All Seasons</option>
    </select>
  </div>

  <div class="recent-form">
    <div class="recent-form-title">Recent Form (Last 5)</div>
    <div class="recent-form-strip" id="recentFormStrip"></div>
  </div>

  <div class="status-line" style="margin-bottom:8px;">Tap a match to expand and see the leg-by-leg breakdown.</div>
  <div class="status-line" id="statusText">Loading results…</div>

  <div class="match-list" id="matchList"></div>

  <div class="empty-state hidden" id="emptyState">
    <div class="tri">▲</div>
    <p><strong>No match results recorded yet.</strong></p>
  </div>
</main>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAiIaXtQRBvDGFllrzmjYbx_Br1mR65Ox8",
    authDomain: "stapleford-cue-stars.firebaseapp.com",
    projectId: "stapleford-cue-stars",
    storageBucket: "stapleford-cue-stars.firebasestorage.app",
    messagingSenderId: "488893378210",
    appId: "1:488893378210:web:9f81ed4b389443081031fb"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const statusText = document.getElementById('statusText');
  const matchList = document.getElementById('matchList');
  const emptyState = document.getElementById('emptyState');
  const seasonFilter = document.getElementById('seasonFilter');
  const recentFormStrip = document.getElementById('recentFormStrip');
  let expandedKeys = new Set();
  let allResults = [];

  function parseDMY(str){
    const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(str || '');
    if(!m) return null;
    return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
  }

  function renderRecentForm(matches){
    if(matches.length === 0){
      recentFormStrip.innerHTML = '<span class="recent-form-empty">No matches yet.</span>';
      return;
    }
    const lastFive = matches.slice(0, 5).reverse();
    recentFormStrip.innerHTML = lastFive.map(m => {
      let outcome = 'draw';
      let letter = 'D';
      if(m.won > m.lost){ outcome = 'win'; letter = 'W'; }
      else if(m.won < m.lost){ outcome = 'loss'; letter = 'L'; }
      const title = `${m.matchDate || 'Unknown date'} · ${m.homeTeam || '—'} vs ${m.awayTeam || '—'} · ${m.won}-${m.lost}`;
      return `<div class="recent-form-dot ${outcome}" title="${title}">${letter}</div>`;
    }).join('');
  }

  function renderMatches(results){
    const season = seasonFilter.value;
    const scoped = season === 'all' ? results : results.filter(r => r.season === season);

    const groups = {};
    scoped.forEach(r => {
      const key = `${r.matchDate}|${r.homeTeam}|${r.awayTeam}`;
      if(!groups[key]){
        groups[key] = {
          key,
          matchDate: r.matchDate,
          homeTeam: r.homeTeam,
          awayTeam: r.awayTeam,
          won: 0,
          lost: 0,
          legs: [],
          d: parseDMY(r.matchDate)
        };
      }
      if(r.result === 'Win'){ groups[key].won += 1; } else { groups[key].lost += 1; }
      groups[key].legs.push({ leg: r.leg, playerName: r.playerName, result: r.result });
    });

    const matches = Object.values(groups).sort((a, b) => {
      if(!a.d && !b.d) return 0;
      if(!a.d) return 1;
      if(!b.d) return -1;
      return b.d - a.d;
    });

    statusText.textContent = `${matches.length} match${matches.length === 1 ? '' : 'es'} recorded`;

    renderRecentForm(matches);

    if(matches.length === 0){
      matchList.innerHTML = '';
      emptyState.classList.remove('hidden');
      return;
    }
    emptyState.classList.add('hidden');

    matchList.innerHTML = matches.map(m => {
      let outcome = 'draw';
      if(m.won > m.lost){ outcome = 'win'; }
      else if(m.won < m.lost){ outcome = 'loss'; }
      const tagText = outcome === 'win' ? 'Win' : outcome === 'loss' ? 'Loss' : 'Draw';
      const isExpanded = expandedKeys.has(m.key);
      const sortedLegs = m.legs.slice().sort((a, b) => Number(a.leg) - Number(b.leg));
      const legsHtml = sortedLegs.map(l => `
        <div class="leg-row">
          <span class="leg-num">Leg ${l.leg}</span>
          <span class="leg-player">${l.playerName || '—'}</span>
          <span class="leg-badge ${l.result === 'Win' ? 'win' : 'lose'}">${l.result}</span>
        </div>
      `).join('');
      return `
        <div class="match-card ${isExpanded ? 'expanded' : ''}" data-key="${m.key}">
          <div class="match-row">
            <div>
              <div class="match-date">${m.matchDate || 'Unknown date'}</div>
              <div class="match-fixture">${m.homeTeam || '—'}<span class="vs">vs</span>${m.awayTeam || '—'}<span class="chevron">▼</span></div>
            </div>
            <div class="match-score-wrap">
              <div class="match-score ${outcome}">${m.won} – ${m.lost}</div>
              <div class="match-tag ${outcome}">${tagText}</div>
            </div>
          </div>
          <div class="legs-panel">${legsHtml}</div>
        </div>
      `;
    }).join('');
  }

  matchList.addEventListener('click', (e) => {
    const row = e.target.closest('.match-row');
    if(!row) return;
    const card = row.closest('.match-card');
    const key = card.dataset.key;
    if(expandedKeys.has(key)){
      expandedKeys.delete(key);
      card.classList.remove('expanded');
    } else {
      expandedKeys.add(key);
      card.classList.add('expanded');
    }
  });

  db.collection('results').onSnapshot((snapshot) => {
    allResults = snapshot.docs.map(doc => doc.data());
    renderMatches(allResults);
  }, () => {
    statusText.textContent = 'Could not load results.';
  });

  db.collection('seasons').orderBy('name', 'asc').onSnapshot((snapshot) => {
    const prevValue = seasonFilter.value;
    seasonFilter.innerHTML = '<option value="all">All Seasons</option>' + snapshot.docs.map(doc =>
      `<option value="${doc.data().name}">${doc.data().name}</option>`
    ).join('');
    if(prevValue){ seasonFilter.value = prevValue; }
  });

  seasonFilter.addEventListener('change', () => renderMatches(allResults));
</script>
</body>
</html>
