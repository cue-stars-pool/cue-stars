<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixture Manager - Stapleford Cue Stars Pool Team</title>
<style>
  :root{
    --felt: #0f4d3a;
    --felt-dark: #0a3a2b;
    --rail: #4a2c1d;
    --rail-dark: #331f14;
    --ivory: #f3ede0;
    --gold: #c9a227;
    --line: rgba(243,237,224,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.04), transparent 40%),
      var(--felt);
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      var(--felt);
    font-family: 'Segoe UI', -apple-system, system-ui, sans-serif;
    color: var(--ivory);
    padding-bottom: 60px;
  }
  .rail{
    background: linear-gradient(180deg, var(--rail) 0%, var(--rail-dark) 100%);
    border-bottom: 4.5px solid var(--gold);
    padding: 24px 15px 20px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  }
  .rail-inner{ max-width: 620px; margin: 0 auto; }
  .back-link{
    color: var(--gold);
    font-size: 12px;
    text-decoration: none;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  h1{
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: clamp(19px, 4vw, 30px);
    margin: 4px 0 0;
    color: var(--ivory);
    text-shadow: 0 2px 0 rgba(0,0,0,0.3);
  }

  main{
    max-width: 620px;
    margin: 0 auto;
    padding: 24px 15px 0;
  }

  .card{
    background: rgba(0,0,0,0.18);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 22px;
  }
  .card-title{
    color: var(--gold);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 14px;
  }

  .field{ margin-bottom: 14px; }
  .field label{
    display:block;
    color: var(--gold);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .field input, .field select{
    width: 100%;
    background: var(--ivory);
    color: #1c1b19;
    border: 1px solid var(--line);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }
  .field input:focus, .field select:focus{ outline:none; border-color: var(--gold); }
  .field option{ color: #1c1b19; }

  .row-2{ display: flex; gap: 12px; }
  .row-2 .field{ flex: 1; }

  .add-btn{
    width: 100%;
    background: var(--gold);
    color: var(--rail-dark);
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 4px;
  }
  .add-btn:hover{ filter: brightness(1.08); }

  .form-msg{ font-size: 12px; margin-top: 10px; min-height: 16px; text-align: center; }

  .status-line{
    font-size: 11px;
    color: rgba(243,237,224,0.6);
    margin-bottom: 12px;
    letter-spacing: 0.3px;
  }

  .fixture-list{ display: flex; flex-direction: column; gap: 10px; }
  .fixture-row{
    background: rgba(0,0,0,0.18);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .fixture-row.is-next{ border-color: var(--gold); background: rgba(201,162,39,0.1); }
  .fixture-row input[type="checkbox"]{
    width: 17px; height: 17px; flex-shrink: 0;
    accent-color: #d9534f; cursor: pointer;
  }
  .fixture-info{ flex: 1; min-width: 0; }
  .fixture-date{
    font-size: 11px;
    color: rgba(243,237,224,0.55);
    margin-bottom: 2px;
  }
  .fixture-opponent{
    font-size: 14px;
    font-weight: 600;
    color: var(--ivory);
  }
  .fixture-meta{
    font-size: 11.5px;
    color: rgba(243,237,224,0.5);
    margin-top: 2px;
  }
  .next-badge{
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: var(--gold);
    background: rgba(201,162,39,0.18);
    padding: 3px 8px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .delete-bar{ display:flex; justify-content: flex-end; margin-top: 14px; }
  .delete-bar button{
    background: #d9534f;
    color: var(--ivory);
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.4px;
    cursor: pointer;
  }
  .delete-bar button:hover:not(:disabled){ filter: brightness(1.1); }
  .delete-bar button:disabled{ opacity: 0.4; cursor: not-allowed; }

  .empty-state{ padding: 30px 20px; text-align: center; color: rgba(243,237,224,0.6); }
  .empty-state .tri{ font-size: 26px; margin-bottom: 6px; }
  .empty-state p{ margin: 4px 0; font-size: 13px; }

  .not-admin{ text-align: center; padding: 50px 24px; color: rgba(243,237,224,0.6); }
  .not-admin h2{
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ivory);
    font-size: 20px;
    margin-bottom: 8px;
  }

  .hidden{ display:none !important; }

  .overlay{
    position: fixed; inset:0;
    background: rgba(0,0,0,0.55);
    display:none;
    align-items:center; justify-content:center;
    padding: 20px;
    z-index: 50;
  }
  .overlay.show{ display:flex; }
  .modal{
    background: var(--rail);
    border: 1px solid var(--gold);
    border-radius: 10px;
    padding: 26px;
    max-width: 320px;
    width: 100%;
    text-align:center;
  }
  .modal h2{
    margin: 0 0 6px;
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 18px;
    color: var(--ivory);
  }
  .modal p{ font-size: 13px; color: rgba(243,237,224,0.7); margin: 0 0 14px; }
  .modal-actions{ display:flex; gap: 10px; margin-top: 6px; }
  .modal-actions button{
    flex:1; padding: 10px; border-radius: 6px; border: none;
    font-weight: 700; cursor: pointer; font-size: 13px;
  }
  .modal-actions .confirm{ background: #d9534f; color: var(--ivory); }
  .modal-actions .cancel{ background: transparent; color: var(--ivory); border: 1px solid var(--line); }
</style>
</head>
<body>

<div class="rail">
  <div class="rail-inner">
    <a class="back-link" href="index.html">&larr; Home</a>
    <h1>Fixture Manager</h1>
  </div>
</div>

<div class="not-admin hidden" id="notAdminView">
  <div style="max-width:620px; margin:0 auto; padding:0 15px;">
    <h2>Admins Only</h2>
    <p>You need to be signed in as admin to manage fixtures.</p>
    <p><a class="back-link" href="index.html">&larr; Back to Home</a></p>
  </div>
</div>

<div class="hidden" id="pageContent">
<main>

  <div class="card">
    <div class="card-title">Add a Fixture</div>
    <div class="field">
      <label for="fixtureDate">Date</label>
      <input type="text" id="fixtureDate" placeholder="dd/mm/yyyy" maxlength="10">
    </div>
    <div class="field">
      <label for="fixtureOpponent">Opponent</label>
      <select id="fixtureOpponent">
        <option value="">Loading venues…</option>
      </select>
    </div>
    <div class="field">
      <label for="fixtureCompetition">Competition</label>
      <input type="text" id="fixtureCompetition" placeholder="e.g. Division 1 Match Week 18" maxlength="80">
    </div>
    <div class="field">
      <label for="fixtureVenue">Venue</label>
      <input type="text" id="fixtureVenue" placeholder="e.g. Bell Inn Sawley" maxlength="80">
    </div>
    <button type="button" class="add-btn" id="addFixtureBtn">Add Fixture</button>
    <div class="form-msg" id="addFixtureMsg"></div>
  </div>

  <div class="status-line" id="statusText">Loading fixtures…</div>

  <div class="fixture-list" id="fixtureList"></div>

  <div class="empty-state hidden" id="emptyState">
    <div class="tri">▲</div>
    <p><strong>No fixtures added yet.</strong></p>
  </div>

  <div class="delete-bar hidden" id="deleteBar">
    <button type="button" id="deleteSelectedBtn" disabled>Delete Selected</button>
  </div>

</main>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="modal">
    <h2>Remove Fixtures?</h2>
    <p id="confirmMessage"></p>
    <div class="modal-actions">
      <button type="button" class="cancel" id="confirmNo">No</button>
      <button type="button" class="confirm" id="confirmYes">Yes, Delete</button>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAiIaXtQRBvDGFllrzmjYbx_Br1mR65Ox8",
    authDomain: "stapleford-cue-stars.firebaseapp.com",
    projectId: "stapleford-cue-stars",
    storageBucket: "stapleford-cue-stars.firebasestorage.app",
    messagingSenderId: "488893378210",
    appId: "1:488893378210:web:9f81ed4b389443081031fb"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const notAdminView = document.getElementById('notAdminView');
  const pageContent = document.getElementById('pageContent');

  const fixtureDate = document.getElementById('fixtureDate');
  const fixtureOpponent = document.getElementById('fixtureOpponent');
  const fixtureCompetition = document.getElementById('fixtureCompetition');
  const fixtureVenue = document.getElementById('fixtureVenue');
  const addFixtureBtn = document.getElementById('addFixtureBtn');
  const addFixtureMsg = document.getElementById('addFixtureMsg');

  const statusText = document.getElementById('statusText');
  const fixtureList = document.getElementById('fixtureList');
  const emptyState = document.getElementById('emptyState');
  const deleteBar = document.getElementById('deleteBar');
  const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
  const confirmOverlay = document.getElementById('confirmOverlay');
  const confirmMessage = document.getElementById('confirmMessage');
  const confirmYes = document.getElementById('confirmYes');
  const confirmNo = document.getElementById('confirmNo');

  let selectedIds = new Set();
  let venuesLoaded = false;

  function todayFormatted(){
    const d = new Date();
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yyyy = d.getFullYear();
    return `${dd}/${mm}/${yyyy}`;
  }
  fixtureDate.value = todayFormatted();

  function parseDMY(str){
    const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(str || '');
    if(!m) return null;
    const d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
    d.setHours(0,0,0,0);
    return d;
  }

  function loadVenuesForDropdown(){
    if(venuesLoaded) return;
    venuesLoaded = true;
    db.collection('venues').orderBy('name', 'asc').onSnapshot((snapshot) => {
      if(snapshot.empty){
        fixtureOpponent.innerHTML = '<option value="">No venues yet</option>';
        return;
      }
      fixtureOpponent.innerHTML = '<option value="">Select opponent…</option>' + snapshot.docs.map(doc =>
        `<option value="${doc.data().name}">${doc.data().name}</option>`
      ).join('');
    });
  }

  addFixtureBtn.addEventListener('click', async () => {
    addFixtureMsg.textContent = '';
    const date = fixtureDate.value.trim();
    const opponent = fixtureOpponent.value;
    const competition = fixtureCompetition.value.trim();
    const venue = fixtureVenue.value.trim();

    if(!/^\d{2}\/\d{2}\/\d{4}$/.test(date)){
      addFixtureMsg.style.color = '#ff8a80';
      addFixtureMsg.textContent = 'Please enter the date as dd/mm/yyyy.';
      return;
    }
    if(!opponent){
      addFixtureMsg.style.color = '#ff8a80';
      addFixtureMsg.textContent = 'Please select an opponent.';
      return;
    }

    try{
      await db.collection('fixtures').add({
        date, opponent, competition, venue, createdAt: Date.now()
      });
      addFixtureMsg.style.color = '#8fd19e';
      addFixtureMsg.textContent = 'Fixture added.';
      fixtureCompetition.value = '';
      fixtureVenue.value = '';
      setTimeout(() => { addFixtureMsg.textContent = ''; }, 2000);
    } catch(e){
      addFixtureMsg.style.color = '#ff8a80';
      addFixtureMsg.textContent = 'Could not add — make sure you are signed in as admin.';
    }
  });

  function renderFixtures(fixtures){
    const today = new Date();
    today.setHours(0,0,0,0);

    const withDates = fixtures.map(f => ({ ...f, d: parseDMY(f.date) }));
    withDates.sort((a, b) => {
      if(!a.d && !b.d) return 0;
      if(!a.d) return 1;
      if(!b.d) return -1;
      return a.d - b.d;
    });

    const nextFixture = withDates.find(f => f.d && f.d >= today);

    statusText.textContent = `${fixtures.length} fixture${fixtures.length === 1 ? '' : 's'} in the list`;

    if(withDates.length === 0){
      fixtureList.innerHTML = '';
      emptyState.classList.remove('hidden');
      deleteBar.classList.add('hidden');
      return;
    }
    emptyState.classList.add('hidden');
    deleteBar.classList.remove('hidden');

    fixtureList.innerHTML = withDates.map(f => {
      const isNext = nextFixture && f.id === nextFixture.id;
      return `
        <div class="fixture-row ${isNext ? 'is-next' : ''}">
          <input type="checkbox" data-id="${f.id}" ${selectedIds.has(f.id) ? 'checked' : ''}>
          <div class="fixture-info">
            <div class="fixture-date">${f.date || 'Unknown date'}</div>
            <div class="fixture-opponent">vs ${f.opponent || '—'}</div>
            <div class="fixture-meta">${f.competition || 'No competition set'}${f.venue ? ' · ' + f.venue : ''}</div>
          </div>
          ${isNext ? '<span class="next-badge">Next Up</span>' : ''}
        </div>
      `;
    }).join('');

    deleteSelectedBtn.disabled = selectedIds.size === 0;
    deleteSelectedBtn.textContent = selectedIds.size > 0 ? `Delete Selected (${selectedIds.size})` : 'Delete Selected';
  }

  fixtureList.addEventListener('change', (e) => {
    if(e.target.matches('input[type="checkbox"]')){
      const id = e.target.dataset.id;
      if(e.target.checked){ selectedIds.add(id); } else { selectedIds.delete(id); }
      deleteSelectedBtn.disabled = selectedIds.size === 0;
      deleteSelectedBtn.textContent = selectedIds.size > 0 ? `Delete Selected (${selectedIds.size})` : 'Delete Selected';
    }
  });

  deleteSelectedBtn.addEventListener('click', () => {
    if(selectedIds.size === 0) return;
    confirmMessage.textContent = `Remove ${selectedIds.size} fixture${selectedIds.size === 1 ? '' : 's'} from the list? This cannot be undone.`;
    confirmOverlay.classList.add('show');
  });
  confirmNo.addEventListener('click', () => confirmOverlay.classList.remove('show'));
  confirmYes.addEventListener('click', async () => {
    const idsToDelete = Array.from(selectedIds);
    selectedIds.clear();
    confirmOverlay.classList.remove('show');
    try{
      const batch = db.batch();
      idsToDelete.forEach(id => batch.delete(db.collection('fixtures').doc(id)));
      await batch.commit();
    } catch(e){
      statusText.textContent = 'Could not delete — please try again.';
    }
  });

  let fixturesLoaded = false;
  function loadFixtures(){
    if(fixturesLoaded) return;
    fixturesLoaded = true;
    db.collection('fixtures').onSnapshot((snapshot) => {
      const fixtures = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderFixtures(fixtures);
    }, () => {
      statusText.textContent = 'Could not load fixtures.';
    });
  }

  auth.onAuthStateChanged((user) => {
    if(user){
      notAdminView.classList.add('hidden');
      pageContent.classList.remove('hidden');
      loadVenuesForDropdown();
      loadFixtures();
    } else {
      pageContent.classList.add('hidden');
      notAdminView.classList.remove('hidden');
    }
  });
</script>
</body>
</html>
